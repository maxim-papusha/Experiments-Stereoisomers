[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments-stereoisomers"
version = "0.1.0"
description = "Two research applications for tetrahedral stereocenter detection and stereoisomer enumeration"
requires-python = ">=3.11"
dependencies = [
  "rdkit>=2025.3",
  "numpy",
  "networkx>=3",
  "matplotlib>=3.8",
  "streamlit>=1.40",
  "stereomolgraph @ git+https://github.com/maxim-papusha/StereoMolGraph.git@stereoisomer",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stereoapps*"]
