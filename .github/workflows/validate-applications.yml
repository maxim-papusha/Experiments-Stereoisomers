name: Validate two stereochemistry applications and build dependency diagrams

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out applications
        uses: actions/checkout@v4

      - name: Check out StereoMolGraph stereoisomer branch
        uses: actions/checkout@v4
        with:
          repository: maxim-papusha/StereoMolGraph
          ref: stereoisomer
          path: _stereomolgraph

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./_stereomolgraph
          python -m pip install pytest networkx matplotlib streamlit

      - name: Compile both applications
        run: python -m compileall -q apps stereoapps

      - name: Run application tests
        run: python -m pytest tests -q

      - name: Generate complex-molecule dependency graphs
        run: |
          python examples/generate_dependency_figures.py --output examples/figures
          cat examples/figures/examples.json

      - name: Upload SVGs and analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetrahedral-dependency-examples
          path: examples/figures/
          if-no-files-found: warn

      - name: Commit reproducible example SVG figures
        if: success()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/figures/
          if ! git diff --cached --quiet; then
            git commit -m "Generate dependency graphs for complex tetrahedral molecules"
            git push origin HEAD:main
          fi
